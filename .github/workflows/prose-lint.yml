name: Prose lint

on:
  pull_request:
    paths: ["docs/**", ".vale.ini", "styles/config/**"]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2.1.1
        with:
          files: docs
          fail_on_error: true
